[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "g13d"
version = "1.3.0"
description = "Native Linux daemon, CLI and GTK4 GUI for the Logitech G13 gameboard (on top of the kernel hid-lg-g15 driver)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Raphaël Lang" }]
dependencies = [
    "evdev>=1.6",
    "dbus-next>=0.2",
    "Pillow>=10",
    "pyudev>=0.24",
    "psutil>=5.9",
]

[project.optional-dependencies]
gui = ["PyGObject>=3.46"]
test = ["pytest"]

[project.scripts]
g13d = "g13d.daemon.main:main"
g13ctl = "g13d.cli.g13ctl:main"
g13-gui = "g13d.gui.app:main"

[tool.setuptools.packages.find]
include = ["g13d*"]

[tool.setuptools.package-data]
g13d = ["data/*", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
